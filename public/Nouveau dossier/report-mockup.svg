  <text x="30" y="270" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#f87171">✗</text>
  <text x="46" y="270" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="rgba(255,255,255,0.65)">Bandeau cookies</text>
  <rect x="296" y="259" width="84" height="14" rx="7" fill="rgba(248,113,113,0.1)"/>
  <text x="338" y="270" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#f87171">Manquant</text>

