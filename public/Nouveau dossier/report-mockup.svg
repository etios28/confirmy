  <text x="338" y="322" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#fde047">Partiel</text>
  <!-- Séparateur -->
  <line x1="20" y1="344" x2="380" y2="344" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
  <!-- Recommandation -->
  <rect x="20" y="356" width="360" height="44" rx="10" fill="rgba(124,58,237,0.1)" stroke="rgba(124,58,237,0.2)" stroke-width="0.5"/>
  <text x="34" y="373" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="rgba(167,139,250,0.7)" letter-spacing="0.8">RECOMMANDATION</text>
