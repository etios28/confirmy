  <text x="46" y="296" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="rgba(255,255,255,0.65)">CGV / CGU</text>
  <rect x="296" y="285" width="84" height="14" rx="7" fill="rgba(74,222,128,0.1)"/>
  <text x="338" y="296" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#4ade80">Présentes</text>

  <circle cx="30" cy="318" r="7" fill="rgba(253,224,71,0.12)" stroke="rgba(253,224,71,0.25)" stroke-width="0.5"/>
  <text x="30" y="322" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#fde047">~</text>
  <text x="46" y="322" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="rgba(255,255,255,0.65)">Droits utilisateurs</text>
