  <text x="46" y="244" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="rgba(255,255,255,0.65)">RGPD &amp; Confidentialité</text>
  <rect x="296" y="233" width="84" height="14" rx="7" fill="rgba(74,222,128,0.1)"/>
  <text x="338" y="244" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#4ade80">Présentes</text>

